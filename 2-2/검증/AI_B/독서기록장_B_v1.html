<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="나의 독서 기록장">
  <title>나의 독서 기록장</title>
  <style>
    :root{--ink:#202124;--muted:#737579;--paper:#fff;--ground:#fff;--accent:#7bd844;--accent-dark:#57b927;--soft:#f7f7f7;--line:#eeeeee;--danger:#d64e59;--shadow:0 5px 16px rgba(0,0,0,.06)}
    *{box-sizing:border-box}html{background:#fff}body{margin:0;color:var(--ink);background:#fff;font-family:Pretendard,"Apple SD Gothic Neo","Noto Sans KR",Arial,sans-serif;line-height:1.5}button,input,select,textarea{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid rgba(123,216,68,.35);outline-offset:2px}.wrap{width:min(1420px,calc(100% - 48px));margin:auto}.hero{padding:54px 0 35px;background:#fff;border:0}.hero .label{display:none}.hero h1{margin:0;font-size:clamp(2rem,4vw,2.65rem);line-height:1.2;letter-spacing:-.065em}.hero p:last-child{margin:7px 0 0;color:var(--muted);font-size:1rem}main{padding:5px 0 80px}.panel{padding:44px 0;margin:0;background:#fff;border:0;border-bottom:1px solid var(--line);border-radius:0;box-shadow:none}.section-head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;margin-bottom:25px}.section-head h2{margin:0;font-size:1.62rem;font-weight:800;letter-spacing:-.06em}.section-head p{margin:5px 0 0;color:var(--muted);font-size:.95rem}.goal-grid{display:grid;grid-template-columns:260px 1fr;gap:42px;align-items:center}.goal-input label{font-weight:750}.goal-input .row{display:flex;gap:7px;margin-top:8px}.goal-input input{min-width:0;flex:1}.primary{padding:10px 17px;color:#1f4210;font-weight:800;background:var(--accent);border:1px solid var(--accent);border-radius:7px}.primary:hover{background:var(--accent-dark);border-color:var(--accent-dark);color:#fff}.goal-summary{padding:0;background:transparent;border:0;border-radius:0}.goal-summary strong{font-size:1.16rem}.goal-summary p{margin:4px 0 11px;color:var(--muted);font-size:.91rem}.progress{height:15px;overflow:hidden;background:#f2f2f2;border-radius:5px}.progress>span{display:block;height:100%;background:var(--accent);border-radius:5px;transition:width .25s ease}.form-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}.field.wide{grid-column:1/-1}label{display:block;margin-bottom:7px;font-size:.9rem;font-weight:750}.required{color:var(--danger)}input,select,textarea{width:100%;padding:11px 12px;color:var(--ink);background:#fff;border:1px solid #dedede;border-radius:6px}input::placeholder,textarea::placeholder{color:#b6b6b6}textarea{min-height:88px;resize:vertical}.invalid{border-color:var(--danger);background:#fff9f9}.rating-box{display:flex;align-items:center;gap:2px;min-height:43px}.star{padding:2px;color:#d9d9d9;font-size:1.65rem;line-height:1;background:transparent;border:0}.star.on{color:#ffca3b}.rating-help{margin:0 0 0 5px;color:var(--muted);font-size:.82rem}.notice{display:none;padding:12px 13px;margin:0 0 16px;color:#873b46;background:#fff6f6;border:1px solid #f1d2d5;border-radius:6px}.notice.show{display:block}.form-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:22px}.secondary,.danger{padding:8px 11px;font-weight:750;background:#fff;border-radius:6px}.secondary{color:#4a4a4a;border:1px solid #dedede}.danger{color:var(--danger);border:1px solid #f1d0d4}.monthly-list{display:flex;flex-wrap:wrap;gap:8px}.month-chip{padding:8px 12px;color:#333;background:var(--soft);border-radius:5px;font-size:.9rem;font-weight:700}.empty-note{margin:0;color:var(--muted)}.filters{display:grid;grid-template-columns:1fr 180px;gap:9px;margin-bottom:28px}.book-groups{display:grid;gap:38px}.month-heading{display:flex;align-items:center;gap:12px;margin:0 0 18px;font-size:1.17rem;font-weight:800;letter-spacing:-.04em}.month-heading::after{content:"";height:1px;flex:1;background:var(--line)}.books{display:grid;grid-template-columns:repeat(auto-fill,minmax(165px,1fr));gap:28px 18px}.book{position:relative;padding:0;background:transparent;border:0;border-radius:0;min-width:0}.book::before{content:"";display:block;aspect-ratio:7/9;width:100%;margin-bottom:12px;background:linear-gradient(155deg,#f2f2f2 0%,#fbfbfb 100%);border:1px solid #f0f0f0;border-radius:7px;box-shadow:0 4px 10px rgba(0,0,0,.045)}.book:nth-of-type(3n+1)::before{background:linear-gradient(155deg,#d9f2f0,#80ccc5)}.book:nth-of-type(3n+2)::before{background:linear-gradient(155deg,#f2ede8,#d9d0c6)}.book:nth-of-type(3n)::before{background:linear-gradient(155deg,#dcf1c8,#7bd844)}.book-top{display:block}.book h3{display:-webkit-box;overflow:hidden;margin:0;font-size:1.02rem;font-weight:800;letter-spacing:-.04em;line-height:1.35;-webkit-line-clamp:2;-webkit-box-orient:vertical}.author{overflow:hidden;margin:4px 0 0;color:var(--muted);font-size:.86rem;text-overflow:ellipsis;white-space:nowrap}.tag{display:inline-block;padding:3px 7px;margin:0 0 8px;color:#4e7f31;background:#eff9e9;border-radius:4px;font-size:.72rem;font-weight:800}.stars-view{margin:8px 0 0;color:#f1bd38;font-size:.94rem;letter-spacing:0}.stars-view .off{color:#dedede}.review{display:-webkit-box;overflow:hidden;margin:8px 0 0;color:#555;font-size:.88rem;line-height:1.45;-webkit-line-clamp:2;-webkit-box-orient:vertical}.book-foot{display:flex;justify-content:space-between;align-items:center;gap:5px;margin-top:10px;padding-top:9px;border-top:1px solid #f1f1f1}.date{color:#999;font-size:.75rem}.actions{display:flex;gap:3px}.tiny{padding:4px 6px;font-size:.72rem}.toast{position:fixed;z-index:10;right:20px;bottom:20px;max-width:calc(100% - 40px);padding:11px 14px;color:#29571a;background:#eff9e9;border:1px solid #d6efc9;border-radius:7px;box-shadow:var(--shadow);opacity:0;transform:translateY(10px);pointer-events:none;transition:.2s}.toast.show{opacity:1;transform:translateY(0)}@media(max-width:750px){.wrap{width:min(100% - 30px,620px)}.hero{padding:37px 0 20px}.panel{padding:32px 0}.goal-grid,.form-grid,.filters{grid-template-columns:1fr}.section-head{align-items:stretch;flex-direction:column}.goal-input .row{max-width:none}.books{grid-template-columns:repeat(2,minmax(0,1fr));gap:26px 14px}.form-actions{flex-direction:column-reverse}.form-actions button{width:100%}}@media(max-width:380px){.books{grid-template-columns:1fr}.book::before{aspect-ratio:16/9}.book-foot{align-items:flex-start;flex-direction:column}.actions{width:100%}.actions button{flex:1}}
  </style>
</head>
<body>
  <header class="hero"><div class="wrap"><p class="label">READING JOURNAL</p><h1>나의 독서 기록장</h1><p>읽은 책을 한곳에 모으고, 올해의 독서 흐름을 확인해 보세요.</p></div></header>
  <main class="wrap">
    <section class="panel" aria-labelledby="goalTitle"><div class="section-head"><div><h2 id="goalTitle">올해 목표</h2><p id="goalYear"></p></div></div><div class="goal-grid"><div class="goal-input"><label for="goalInput">목표 권수</label><div class="row"><input id="goalInput" type="number" min="1" inputmode="numeric" placeholder="예: 24"><button id="goalSave" class="primary" type="button">저장</button></div></div><div id="goalSummary" class="goal-summary"></div></div></section>
    <section class="panel" aria-labelledby="formTitle"><div class="section-head"><div><h2 id="formTitle">책 기록하기</h2><p>다 읽은 책을 바로 기록해 보세요.</p></div></div><div id="notice" class="notice" role="alert"></div>
      <form id="bookForm" novalidate><div class="form-grid"><div class="field"><label for="title">제목 <span class="required">*</span></label><input id="title" required></div><div class="field"><label for="author">저자 <span class="required">*</span></label><input id="author" required></div><div class="field"><label for="finishedAt">다 읽은 날짜 <span class="required">*</span></label><input id="finishedAt" type="date" required></div><div class="field"><label for="genre">장르 <span class="required">*</span></label><select id="genre" required><option value="">선택하세요</option><option>소설</option><option>에세이</option><option>인문</option><option>경제·경영</option><option>자기계발</option><option>과학</option><option>기타</option></select></div><div class="field"><label>별점 <span class="required">*</span></label><div id="ratingBox" class="rating-box" role="radiogroup" aria-label="별점 선택"></div><p class="rating-help" id="ratingText">별을 눌러 1~5점을 선택하세요.</p></div><div class="field"><label for="review">한 줄 평 <span class="required">*</span></label><textarea id="review" placeholder="이 책을 한 문장으로 남겨 보세요." required></textarea></div></div><div class="form-actions"><button id="cancelEdit" class="secondary" type="button" hidden>수정 취소</button><button class="primary" type="submit" id="submitButton">기록하기</button></div></form>
    </section>
    <section class="panel" aria-labelledby="monthlyTitle"><div class="section-head"><div><h2 id="monthlyTitle">월별 읽은 권수</h2><p>다 읽은 날짜를 기준으로 최근 달부터 표시합니다.</p></div></div><div id="monthlyList" class="monthly-list"></div></section>
    <section class="panel" aria-labelledby="listTitle"><div class="section-head"><div><h2 id="listTitle">기록 목록</h2><p id="listCount"></p></div></div><div class="filters"><input id="search" type="search" placeholder="제목 또는 저자로 검색"><select id="genreFilter" aria-label="장르 필터"><option value="">모든 장르</option><option>소설</option><option>에세이</option><option>인문</option><option>경제·경영</option><option>자기계발</option><option>과학</option><option>기타</option></select></div><div id="bookGroups" class="book-groups"></div></section>
  </main><div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script>
    (()=>{'use strict';
      const STORE='reading-journal-b-v1'; const $=s=>document.querySelector(s); const state={books:[],goal:null,editingId:null,rating:0}; const fields=['title','author','finishedAt','genre','review'];
      const today=()=>new Date().toISOString().slice(0,10); const year=()=>String(new Date().getFullYear()); const safe=v=>String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c])); const id=()=>crypto?.randomUUID?.()||`${Date.now()}-${Math.random()}`;
      function save(){try{localStorage.setItem(STORE,JSON.stringify({books:state.books,goal:state.goal}));return true}catch(e){toast('브라우저에 저장하지 못했습니다. 저장 공간 설정을 확인해 주세요.',true);return false}}
      function load(){try{const data=JSON.parse(localStorage.getItem(STORE)||'{}');state.books=Array.isArray(data.books)?data.books:[];state.goal=Number.isInteger(data.goal)&&data.goal>0?data.goal:null}catch(e){state.books=[];state.goal=null}}
      function toast(message,bad=false){const el=$('#toast');el.textContent=message;el.style.background=bad?'#fff1f2':'#ddf2e9';el.style.color=bad?'#873b46':'#17493f';el.style.borderColor=bad?'#f1c9cf':'#b8dfcf';el.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>el.classList.remove('show'),3000)}
      function formatDate(d){const [y,m,day]=d.split('-');return `${y}.${m}.${day}`}; function stars(n){return `<span aria-label="별점 ${n}점">${'★'.repeat(n)}<span class="off">${'☆'.repeat(5-n)}</span></span>`}; function sorted(items=state.books){return [...items].sort((a,b)=>b.finishedAt.localeCompare(a.finishedAt)||b.createdAt-a.createdAt)}
      function renderGoal(){const currentYear=year();const read=state.books.filter(b=>b.finishedAt.slice(0,4)===currentYear).length;$('#goalYear').textContent=`${currentYear}년 기준`;$('#goalInput').value=state.goal||'';const box=$('#goalSummary');if(!state.goal){box.innerHTML='<strong>올해 목표 권수를 정해 보세요.</strong><p>목표를 저장하면 올해 읽은 권수와 달성률을 확인할 수 있어요.</p><div class="progress"><span style="width:0%"></span></div>';return}const percent=Math.round(read/state.goal*100);box.innerHTML=`<strong>${state.goal}권 중 ${read}권 (${percent}%)</strong><p>올해 완독한 책만 계산합니다.</p><div class="progress" aria-label="목표 달성률 ${percent}%"><span style="width:${Math.min(percent,100)}%"></span></div>`}
      function renderRating(){const box=$('#ratingBox');box.innerHTML=[1,2,3,4,5].map(n=>`<button class="star ${n<=state.rating?'on':''}" type="button" data-rating="${n}" role="radio" aria-checked="${n===state.rating}" aria-label="${n}점">★</button>`).join('');$('#ratingText').textContent=state.rating?`${state.rating}점 선택됨`:'별을 눌러 1~5점을 선택하세요.'}
      function renderMonthly(){const count=new Map();state.books.forEach(b=>{const key=b.finishedAt.slice(0,7);count.set(key,(count.get(key)||0)+1)});const entries=[...count].sort((a,b)=>b[0].localeCompare(a[0]));$('#monthlyList').innerHTML=entries.length?entries.map(([key,n])=>{const [y,m]=key.split('-');return `<span class="month-chip">${y}년 ${Number(m)}월 ${n}권</span>`}).join(''):'<p class="empty-note">아직 기록한 책이 없습니다.</p>'}
      function renderBooks(){const term=$('#search').value.trim().toLowerCase(), genre=$('#genreFilter').value;const all=sorted(), shown=all.filter(b=>(!term||b.title.toLowerCase().includes(term)||b.author.toLowerCase().includes(term))&&(!genre||b.genre===genre));$('#listCount').textContent=`총 ${all.length}권 · 조건에 맞는 ${shown.length}권`;
        const area=$('#bookGroups');if(!all.length){area.innerHTML='<p class="empty-note">아직 기록한 책이 없습니다.</p>';return}if(!shown.length){area.innerHTML='<p class="empty-note">조건에 맞는 기록이 없습니다.</p>';return}const groups=new Map();shown.forEach(b=>{const key=b.finishedAt.slice(0,7);if(!groups.has(key))groups.set(key,[]);groups.get(key).push(b)});area.innerHTML=[...groups.entries()].sort((a,b)=>b[0].localeCompare(a[0])).map(([key,books])=>{const [y,m]=key.split('-');return `<section><h3 class="month-heading">${y}년 ${Number(m)}월</h3><div class="books">${books.map(b=>`<article class="book"><div class="book-top"><div><span class="tag">${safe(b.genre)}</span><h3>${safe(b.title)}</h3><p class="author">${safe(b.author)}</p></div><div class="stars-view">${stars(b.rating)}</div></div><p class="review">${safe(b.review)}</p><div class="book-foot"><span class="date">다 읽은 날짜 · ${formatDate(b.finishedAt)}</span><div class="actions"><button class="secondary tiny" data-edit="${b.id}" type="button">수정</button><button class="danger tiny" data-delete="${b.id}" type="button">삭제</button></div></div></article>`).join('')}</div></section>`}).join('')}
      function renderAll(){renderGoal();renderMonthly();renderBooks()}
      function clearInvalid(){fields.forEach(f=>$(`#${f}`).classList.remove('invalid'));$('#ratingBox').classList.remove('invalid')} function notice(message=''){const box=$('#notice');box.textContent=message;box.classList.toggle('show',Boolean(message))}
      function resetForm(){state.editingId=null;state.rating=0;$('#bookForm').reset();$('#finishedAt').value=today();$('#formTitle').textContent='책 기록하기';$('#submitButton').textContent='기록하기';$('#cancelEdit').hidden=true;clearInvalid();notice();renderRating()}
      function validate(){clearInvalid();notice();const values=Object.fromEntries(fields.map(f=>[f,$(`#${f}`).value.trim()]));for(const f of fields){if(!values[f]){$(`#${f}`).classList.add('invalid');notice(`${({title:'제목을',author:'저자를',finishedAt:'다 읽은 날짜를',genre:'장르를',review:'한 줄 평을'})[f]} 입력해 주세요.`);$(`#${f}`).focus();return null}}if(!state.rating){$('#ratingBox').classList.add('invalid');notice('별점을 선택해 주세요.');return null}if(values.finishedAt>today()){$('#finishedAt').classList.add('invalid');notice('다 읽은 날짜는 오늘 이전이어야 합니다.');$('#finishedAt').focus();return null}return {...values,rating:state.rating}}
      $('#ratingBox').addEventListener('click',e=>{const btn=e.target.closest('[data-rating]');if(!btn)return;state.rating=Number(btn.dataset.rating);renderRating();notice()});$('#goalSave').addEventListener('click',()=>{const n=Number($('#goalInput').value);if(!Number.isInteger(n)||n<1){toast('목표 권수는 1권 이상으로 입력해 주세요.',true);return}state.goal=n;if(save()){renderGoal();toast('올해 목표를 저장했습니다.')}});$('#goalInput').addEventListener('input',()=>{const value=$('#goalInput').value;if(value===''){state.goal=null;save();renderGoal();return}const n=Number(value);if(Number.isInteger(n)&&n>0){state.goal=n;save();renderGoal()}});$('#goalInput').addEventListener('keydown',e=>{if(e.key==='Enter'){$('#goalSave').click();e.preventDefault()}});
      $('#bookForm').addEventListener('submit',e=>{e.preventDefault();const values=validate();if(!values)return;const old=state.editingId&&state.books.find(b=>b.id===state.editingId);if(old)Object.assign(old,values);else state.books.push({id:id(),createdAt:Date.now(),...values});if(save()){toast(old?'기록을 수정했습니다.':'새 책을 기록했습니다.');resetForm();renderAll()}});$('#cancelEdit').addEventListener('click',resetForm);$('#search').addEventListener('input',renderBooks);$('#genreFilter').addEventListener('change',renderBooks);
      $('#bookGroups').addEventListener('click',e=>{const edit=e.target.closest('[data-edit]'),del=e.target.closest('[data-delete]');if(edit){const b=state.books.find(x=>x.id===edit.dataset.edit);if(!b)return;state.editingId=b.id;fields.forEach(f=>$(`#${f}`).value=b[f]);state.rating=b.rating;$('#formTitle').textContent='책 기록 수정';$('#submitButton').textContent='수정 완료';$('#cancelEdit').hidden=false;clearInvalid();notice();renderRating();window.scrollTo({top:$('#bookForm').closest('.panel').offsetTop,behavior:'smooth'});return}if(del){const b=state.books.find(x=>x.id===del.dataset.delete);if(b&&confirm(`「${b.title}」 기록을 삭제할까요?`)){state.books=state.books.filter(x=>x.id!==b.id);if(save()){toast('기록을 삭제했습니다.');renderAll()}}}});
      load();resetForm();renderAll();
    })();
  </script>
</body>
</html>
