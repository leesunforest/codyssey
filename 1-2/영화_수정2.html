<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>내 영화 티어리스트</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <style>
    /* Material Design 3 다크 색상 역할. 배경은 블랙 단일 */
    :root {
      --md-background: #000000;
      --md-surface-container: #141317;
      --md-surface-container-high: #1d1b20;
      --md-surface-container-highest: #2b2930;
      --md-on-surface: #e6e1e5;
      --md-on-surface-variant: #cac4d0;
      --md-outline: #938f99;
      --md-outline-variant: #49454f;
      --md-primary: #d0bcff;
      --md-on-primary: #381e72;
      --md-primary-container: #4f378b;
      --md-on-primary-container: #eaddff;
      --md-error: #f2b8b5;
      --md-error-container: #8c1d18;
      --md-on-error-container: #f9dedc;
      --tier-s: #ffb4ab; --tier-a: #ffb870; --tier-b: #e7c65b; --tier-c: #8fd5a6; --tier-u: #938f99;
      --shape-xs: 4px; --shape-s: 8px; --shape-m: 12px; --shape-l: 16px; --shape-xl: 28px; --shape-full: 999px;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; background: var(--md-background); }
    body {
      color: var(--md-on-surface);
      font-family: Pretendard, "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
      font-size: 14px; line-height: 20px; letter-spacing: .25px;
      -webkit-font-smoothing: antialiased;
    }
    button, input { font: inherit; color: inherit; }
    [hidden] { display: none !important; }

    /* 타이포그래피 역할 */
    .headline-small { margin: 0; font-size: 24px; line-height: 32px; font-weight: 600; letter-spacing: 0; }
    .title-large { margin: 0; font-size: 22px; line-height: 28px; font-weight: 600; letter-spacing: 0; }
    .title-medium { margin: 0; font-size: 16px; line-height: 24px; font-weight: 600; letter-spacing: .15px; }
    .body-medium { margin: 0; font-size: 14px; line-height: 20px; color: var(--md-on-surface-variant); }
    .label-large { font-size: 14px; line-height: 20px; font-weight: 600; letter-spacing: .1px; }

    /* 버튼: 상태 레이어(hover 8%, press 12%) */
    .btn { position: relative; display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 40px; padding: 0 24px; border: 0; border-radius: var(--shape-full); cursor: pointer; overflow: hidden; white-space: nowrap; }
    .btn::before { content: ""; position: absolute; inset: 0; background: currentColor; opacity: 0; transition: opacity .15s; }
    .btn:hover::before { opacity: .08; }
    .btn:active::before { opacity: .12; }
    .btn:focus-visible { outline: 3px solid var(--md-primary); outline-offset: 2px; }
    .btn:disabled { opacity: .38; cursor: default; }
    .btn-filled { background: var(--md-primary); color: var(--md-on-primary); }
    .btn-tonal { background: var(--md-primary-container); color: var(--md-on-primary-container); }
    .btn-outlined { background: transparent; color: var(--md-primary); border: 1px solid var(--md-outline); }
    .btn-text { background: transparent; color: var(--md-primary); padding: 0 12px; }
    .btn-error { height: 32px; padding: 0 12px; background: var(--md-error-container); color: var(--md-on-error-container); font-size: 12px; }

    /* 아웃라인 텍스트 필드 */
    .field { display: flex; flex-direction: column; gap: 4px; }
    .field label { font-size: 12px; line-height: 16px; letter-spacing: .4px; color: var(--md-on-surface-variant); }
    .field input { height: 56px; padding: 0 16px; border: 1px solid var(--md-outline); border-radius: var(--shape-xs); background: transparent; outline: none; font-size: 16px; letter-spacing: .5px; }
    .field input:hover { border-color: var(--md-on-surface); }
    .field input:focus { border: 2px solid var(--md-primary); padding: 0 15px; }
    .field input::placeholder { color: var(--md-outline); }
    .supporting { min-height: 16px; margin: 0; font-size: 12px; line-height: 16px; letter-spacing: .4px; color: var(--md-error); }

    /* 로그인 화면 */
    .login { display: grid; place-items: center; min-height: 100vh; padding: 24px; }
    .login-card { width: min(400px, 100%); padding: 24px; border-radius: var(--shape-xl); background: var(--md-surface-container-high); }
    .login-card form { display: grid; gap: 16px; margin-top: 24px; }
    .login-card .btn { width: 100%; }

    /* 상단 앱 바 */
    .top-bar { position: sticky; top: 0; z-index: 2; display: flex; align-items: center; gap: 16px; height: 64px; padding: 0 24px; background: var(--md-background); border-bottom: 1px solid var(--md-outline-variant); }
    .top-bar .title-large { flex: 1; white-space: nowrap; }
    .user-chip { display: inline-flex; align-items: center; gap: 8px; height: 32px; padding: 0 12px 0 4px; border: 1px solid var(--md-outline-variant); border-radius: var(--shape-s); }
    .avatar { display: grid; place-items: center; width: 24px; height: 24px; border-radius: 50%; background: var(--md-primary-container); color: var(--md-on-primary-container); font-size: 12px; font-weight: 700; }

    .page { width: min(1200px, calc(100% - 48px)); margin: 0 auto; padding: 24px 0 64px; }
    header.intro { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: end; gap: 8px 24px; margin-bottom: 24px; }
    .subtitle { white-space: nowrap; font-size: clamp(12px, 1.3vw, 14px); }

    /* 검색 */
    .search-card { padding: 16px; border-radius: var(--shape-l); background: var(--md-surface-container); }
    .search-row { display: grid; grid-template-columns: 1fr auto; gap: 12px; align-items: start; }
    .search-row .field input { height: 48px; border-radius: var(--shape-full); padding: 0 20px; }
    .search-row .field input:focus { padding: 0 19px; }
    .search-row .btn { height: 48px; }
    .results { display: grid; grid-template-columns: repeat(auto-fill, minmax(132px, 1fr)); gap: 12px; margin-top: 8px; }
    .result { display: flex; flex-direction: column; gap: 8px; padding: 8px; border-radius: var(--shape-m); background: var(--md-surface-container-high); }
    .result .poster { width: 100%; aspect-ratio: 2 / 3; }
    .result-title { margin: 0; font-weight: 600; overflow-wrap: anywhere; }
    .result-meta { margin: 0; font-size: 12px; line-height: 16px; color: var(--md-on-surface-variant); }
    .result .btn { height: 32px; padding: 0 12px; margin-top: auto; font-size: 13px; }

    .poster { display: grid; place-items: center; overflow: hidden; border-radius: var(--shape-s); background: var(--md-surface-container-highest); color: var(--md-outline); font-size: 11px; text-align: center; }
    .poster img { display: block; width: 100%; height: 100%; object-fit: cover; }

    /* 티어 보드 */
    .board { margin-top: 24px; overflow: hidden; border: 1px solid var(--md-outline-variant); border-radius: var(--shape-l); background: var(--md-surface-container); }
    .tier-row { display: grid; grid-template-columns: 88px minmax(0, 1fr); min-height: 136px; border-bottom: 1px solid var(--md-outline-variant); }
    .tier-row:last-child { border-bottom: 0; }
    .tier-label { display: grid; place-items: center; color: #1d1b20; font-size: 32px; font-weight: 800; }
    [data-tier="S"] .tier-label { background: var(--tier-s); }
    [data-tier="A"] .tier-label { background: var(--tier-a); }
    [data-tier="B"] .tier-label { background: var(--tier-b); }
    [data-tier="C"] .tier-label { background: var(--tier-c); }
    [data-tier="미분류"] .tier-label { background: var(--tier-u); font-size: 15px; }
    .drop-zone { display: flex; flex-wrap: wrap; align-content: flex-start; gap: 12px; min-width: 0; padding: 12px 16px; transition: background .15s; }
    .drop-zone.is-over { background: rgba(208, 188, 255, .08); box-shadow: inset 0 0 0 2px var(--md-primary); }
    .empty-hint { align-self: center; color: var(--md-outline); font-size: 13px; user-select: none; }

    .movie-card { position: relative; display: flex; flex-direction: column; gap: 6px; width: 88px; padding: 4px 4px 8px; border-radius: var(--shape-m); background: var(--md-surface-container-high); cursor: grab; user-select: none; }
    .movie-card::before { content: ""; position: absolute; inset: 0; border-radius: inherit; background: var(--md-on-surface); opacity: 0; transition: opacity .15s; pointer-events: none; }
    .movie-card:hover::before { opacity: .08; }
    .movie-card:focus-visible { outline: 3px solid var(--md-primary); outline-offset: 2px; }
    .movie-card.dragging { opacity: .38; }
    .movie-card.selected { box-shadow: 0 0 0 2px var(--md-primary); }
    .movie-card .poster { width: 80px; height: 120px; }
    .movie-title { margin: 0 2px; font-size: 12px; line-height: 16px; letter-spacing: .4px; overflow-wrap: anywhere; }
    .movie-card .btn-error { margin: 0 2px; }

    .guide { margin: 16px 4px 0; }

    /* 스낵바 */
    .snackbar { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); max-width: calc(100% - 48px); padding: 14px 16px; border-radius: var(--shape-xs); background: #e6e1e5; color: #322f35; box-shadow: 0 4px 8px rgba(0,0,0,.3); }

    /* 대화상자 */
    dialog { width: min(480px, calc(100% - 48px)); padding: 24px; border: 0; border-radius: var(--shape-xl); background: var(--md-surface-container-high); color: var(--md-on-surface); }
    dialog::backdrop { background: rgba(0, 0, 0, .6); }
    dialog form { display: grid; gap: 16px; margin-top: 16px; }
    .dialog-actions { display: flex; justify-content: flex-end; gap: 8px; }

    @media (max-width: 620px) {
      .top-bar { padding: 0 12px; gap: 8px; }
      .page { width: calc(100% - 24px); }
      .subtitle { font-size: min(12px, calc((100vw - 24px) / 29)); }
      .search-row { grid-template-columns: 1fr; }
      .tier-row { grid-template-columns: 64px minmax(0, 1fr); }
      .tier-label { font-size: 26px; }
      [data-tier="미분류"] .tier-label { font-size: 12px; }
    }
  </style>
</head>
<body>
  <!-- 로그인 -->
  <section class="login" id="login-view">
    <div class="login-card">
      <h1 class="headline-small">내 영화 티어리스트</h1>
      <p class="body-medium" style="margin-top:8px">닉네임과 숫자 4자리 비밀번호를 입력하세요. 처음 쓰는 닉네임이면 새로 만들어집니다.</p>
      <form id="login-form" novalidate>
        <div class="field">
          <label for="nickname">닉네임</label>
          <input id="nickname" type="text" maxlength="20" autocomplete="off" placeholder="예: 영화왕">
        </div>
        <div class="field">
          <label for="pin">비밀번호 (숫자 4자리)</label>
          <input id="pin" type="password" inputmode="numeric" maxlength="4" autocomplete="off" placeholder="••••">
        </div>
        <p class="supporting" id="login-message" role="alert"></p>
        <button class="btn btn-filled label-large" type="submit">시작하기</button>
      </form>
    </div>
  </section>

  <!-- 메인 -->
  <div id="app-view" hidden>
    <div class="top-bar">
      <span class="title-large">내 영화 티어리스트</span>
      <button class="btn btn-text label-large" id="key-button" type="button">API 키</button>
      <span class="user-chip label-large"><span class="avatar" id="avatar"></span><span id="user-name"></span></span>
      <button class="btn btn-outlined label-large" id="logout-button" type="button">로그아웃</button>
    </div>

    <main class="page">
      <header class="intro">
        <h2 class="headline-small">나의 등급표</h2>
        <p class="body-medium subtitle">좋아하는 영화를 끌어서, 지금의 취향대로 한 칸에만 남겨 두세요.</p>
      </header>

      <section class="search-card" aria-label="영화 검색">
        <form class="search-row" id="search-form" novalidate>
          <div class="field">
            <input id="search-input" type="search" maxlength="100" autocomplete="off" placeholder="영화 제목으로 검색" aria-label="영화 제목 검색">
          </div>
          <button class="btn btn-filled label-large" type="submit" id="search-button">검색</button>
        </form>
        <p class="supporting" id="search-message" role="status" style="margin:8px 4px 0"></p>
        <div class="results" id="results"></div>
      </section>

      <section class="board" id="board" aria-label="영화 티어리스트"></section>
      <p class="body-medium guide">카드를 끌어다 다른 칸에 놓으면 옮겨집니다. 카드를 누르면 [삭제] 버튼이 나옵니다.</p>
    </main>
  </div>

  <!-- API 키 입력 -->
  <dialog id="key-dialog">
    <h2 class="headline-small">포스터정보 API 키</h2>
    <p class="body-medium" style="margin-top:16px">문화공공데이터광장(한국영상자료원 포스터정보)에서 받은 서비스 키를 넣어 주세요. 이 브라우저에만 저장됩니다.</p>
    <form method="dialog" id="key-form">
      <div class="field">
        <label for="key-input">서비스 키</label>
        <input id="key-input" type="text" autocomplete="off">
      </div>
      <div class="dialog-actions">
        <button class="btn btn-text label-large" value="cancel" type="submit">취소</button>
        <button class="btn btn-filled label-large" value="save" type="submit">저장</button>
      </div>
    </form>
  </dialog>

  <div class="snackbar body-medium" id="snackbar" role="status" hidden></div>

  <!-- API 키는 같은 폴더의 config.js에 넣습니다. (GitHub에는 올리지 않음) -->
  <script src="config.js"></script>
  <script>
    (() => {
      const TIERS = ["S", "A", "B", "C", "미분류"];
      const API_URL = "http://api.kcisa.kr/openapi/service/rest/meta/KFApost"; // 문화공공데이터광장 한국영상자료원 포스터정보
      const CONFIG_KEY = (window.TIERLIST_CONFIG && window.TIERLIST_CONFIG.serviceKey || "").trim();
      const USERS_KEY = "tierlist.users";
      const DATA_PREFIX = "tierlist.data.";
      const API_KEY_STORE = "tierlist.kcisaKey";
      const SESSION_KEY = "tierlist.currentUser";

      const $ = id => document.getElementById(id);
      const store = {
        get(key, fallback) { try { const v = JSON.parse(localStorage.getItem(key)); return v ?? fallback; } catch { return fallback; } },
        set(key, value) { try { localStorage.setItem(key, JSON.stringify(value)); } catch { /* 저장이 막힌 환경에서도 화면은 동작 */ } }
      };

      let user = null;
      let movies = [];
      let selectedId = null;
      let draggedId = null;
      let lastResults = [];

      // ---------- 로그인 ----------
      async function hashPin(nickname, pin) {
        const text = `${nickname}:${pin}`;
        if (window.crypto && crypto.subtle) {
          const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(text));
          return [...new Uint8Array(buf)].map(b => b.toString(16).padStart(2, "0")).join("");
        }
        let h = 0; for (const ch of text) h = (h * 31 + ch.codePointAt(0)) >>> 0; return "s" + h.toString(16);
      }

      $("login-form").addEventListener("submit", async event => {
        event.preventDefault();
        const nickname = $("nickname").value.trim().replace(/\s+/g, " ");
        const pin = $("pin").value;
        const msg = $("login-message");
        if (!nickname) { msg.textContent = "닉네임을 입력해 주세요"; return; }
        if (!/^\d{4}$/.test(pin)) { msg.textContent = "비밀번호는 숫자 4자리로 입력해 주세요"; return; }
        const users = store.get(USERS_KEY, {});
        const hash = await hashPin(nickname, pin);
        if (users[nickname] && users[nickname] !== hash) { msg.textContent = "비밀번호가 맞지 않아요"; return; }
        if (!users[nickname]) { users[nickname] = hash; store.set(USERS_KEY, users); }
        msg.textContent = "";
        $("pin").value = "";
        try { sessionStorage.setItem(SESSION_KEY, nickname); } catch {}
        enter(nickname);
      });
      $("pin").addEventListener("input", e => { e.target.value = e.target.value.replace(/\D/g, "").slice(0, 4); });

      function enter(nickname) {
        user = nickname;
        movies = store.get(DATA_PREFIX + nickname, []);
        $("user-name").textContent = nickname;
        $("avatar").textContent = [...nickname][0].toUpperCase();
        $("login-view").hidden = true;
        $("app-view").hidden = false;
        $("results").innerHTML = ""; $("search-message").textContent = ""; $("search-input").value = "";
        render();
      }

      $("logout-button").addEventListener("click", () => {
        user = null; movies = []; selectedId = null;
        try { sessionStorage.removeItem(SESSION_KEY); } catch {}
        $("app-view").hidden = true;
        $("login-view").hidden = false;
        $("nickname").focus();
      });

      const save = () => { if (user) store.set(DATA_PREFIX + user, movies); };

      // ---------- API 키 ----------
      const getKey = () => CONFIG_KEY || store.get(API_KEY_STORE, "");
      $("key-button").hidden = Boolean(CONFIG_KEY); // config.js에 키가 있으면 화면에서 숨김
      $("key-button").addEventListener("click", () => { $("key-input").value = getKey(); $("key-dialog").showModal(); });
      $("key-dialog").addEventListener("close", () => {
        if ($("key-dialog").returnValue === "save") { store.set(API_KEY_STORE, $("key-input").value.trim()); snack("API 키를 저장했어요"); }
      });

      // ---------- 검색 ----------
      const cleanTitle = t => String(t || "").replace(/!HS|!HE/g, "").replace(/\s+/g, " ").trim();
      const normalize = t => cleanTitle(t).replace(/\s+/g, "").toLowerCase();

      $("search-form").addEventListener("submit", async event => {
        event.preventDefault();
        const query = $("search-input").value.trim();
        const msg = $("search-message");
        $("results").innerHTML = "";
        if (!query) { msg.textContent = "제목을 입력해 주세요"; return; }
        const key = getKey();
        if (!key) { msg.textContent = "먼저 오른쪽 위 [API 키]에 서비스 키를 넣어 주세요"; return; }
        msg.textContent = "";
        $("search-button").disabled = true;
        $("search-button").textContent = "검색 중…";
        try {
          const params = new URLSearchParams({ serviceKey: key, numOfRows: "100", pageNo: "1", keyword: query });
          const res = await fetch(`${API_URL}?${params}`);
          if (!res.ok) throw new Error("HTTP " + res.status);
          const items = parseItems(await res.text());
          const q = normalize(query);
          const seen = new Set();
          lastResults = items
            .map(item => ({
              id: item.url || item.localId || `${item.title}|${item.poster}`,
              title: cleanTitle(item.title),
              year: (String(item.regDate || item.temporalCoverage || "").match(/\d{4}/) || [""])[0],
              director: cleanTitle(item.creator || ""),
              poster: item.poster
            }))
            .filter(m => m.title && normalize(m.title).includes(q) && !seen.has(m.id) && seen.add(m.id));
          if (!lastResults.length) { msg.textContent = "검색 결과가 없어요"; return; }
          renderResults();
        } catch (error) {
          msg.textContent = "검색하지 못했어요. 인터넷 연결과 API 키를 확인해 주세요.";
        } finally {
          $("search-button").disabled = false;
          $("search-button").textContent = "검색";
        }
      });

      // 응답이 XML이든 JSON이든 item 목록으로 바꿉니다.
      function parseItems(text) {
        const pick = o => ({
          title: o.title, creator: o.creator, regDate: o.regDate, temporalCoverage: o.temporalCoverage,
          url: o.url, localId: o.localId,
          poster: String(o.referenceIdentifier || o.imageObject || o.image || "").split("|").map(x => x.trim()).filter(Boolean)[0] || ""
        });
        const trimmed = text.trim();
        if (trimmed.startsWith("{")) {
          const data = JSON.parse(trimmed);
          let list = data?.response?.body?.items?.item ?? [];
          if (!Array.isArray(list)) list = [list];
          return list.map(pick);
        }
        const doc = new DOMParser().parseFromString(trimmed, "text/xml");
        const code = doc.querySelector("resultCode, returnReasonCode")?.textContent.trim();
        if (code && code !== "00" && code !== "0000") throw new Error("API " + code);
        return [...doc.querySelectorAll("item")].map(el => {
          const o = {};
          [...el.children].forEach(c => { o[c.tagName] = c.textContent.trim(); });
          return pick(o);
        });
      }

      function posterEl(src, title) {
        const box = document.createElement("div");
        box.className = "poster";
        if (src) {
          const img = document.createElement("img");
          img.src = src; img.alt = `${title} 포스터`; img.loading = "lazy"; img.referrerPolicy = "no-referrer";
          img.addEventListener("error", () => { box.textContent = "포스터 없음"; });
          box.append(img);
        } else box.textContent = "포스터 없음";
        return box;
      }

      function renderResults() {
        const wrap = $("results");
        wrap.innerHTML = "";
        lastResults.forEach(m => {
          const card = document.createElement("article");
          card.className = "result";
          const title = document.createElement("p"); title.className = "result-title"; title.textContent = m.title;
          const meta = document.createElement("p"); meta.className = "result-meta"; meta.textContent = [m.year, m.director].filter(Boolean).join(" · ");
          const added = movies.some(x => x.id === m.id);
          const btn = document.createElement("button");
          btn.type = "button"; btn.className = "btn btn-tonal label-large";
          btn.textContent = added ? "추가됨" : "추가"; btn.disabled = added;
          btn.addEventListener("click", () => addMovie(m));
          card.append(posterEl(m.poster, m.title), title, meta, btn);
          wrap.append(card);
        });
      }

      function addMovie(m) {
        if (movies.some(x => x.id === m.id || (normalize(x.title) === normalize(m.title) && x.year === m.year))) {
          $("search-message").textContent = "이미 있는 영화예요"; return;
        }
        movies.push({ id: m.id, title: m.title, year: m.year, poster: m.poster, tier: "미분류" });
        save(); render(); renderResults();
        $("search-message").textContent = "";
        snack(`'${m.title}'을(를) 미분류 칸에 넣었어요`);
      }

      // ---------- 보드 ----------
      function render() {
        const board = $("board");
        board.innerHTML = "";
        TIERS.forEach(tier => {
          const row = document.createElement("div");
          row.className = "tier-row"; row.dataset.tier = tier;
          const label = document.createElement("div"); label.className = "tier-label"; label.textContent = tier;
          const zone = document.createElement("div"); zone.className = "drop-zone"; zone.dataset.tier = tier;
          zone.addEventListener("dragover", e => { e.preventDefault(); zone.classList.add("is-over"); });
          zone.addEventListener("dragleave", e => { if (!zone.contains(e.relatedTarget)) zone.classList.remove("is-over"); });
          zone.addEventListener("drop", e => {
            e.preventDefault(); zone.classList.remove("is-over");
            const id = draggedId || e.dataTransfer.getData("text/plain");
            const movie = movies.find(x => x.id === id);
            if (movie && movie.tier !== tier) { movie.tier = tier; save(); }
            render();
          });
          const inTier = movies.filter(m => m.tier === tier);
          if (!inTier.length) {
            const hint = document.createElement("span"); hint.className = "empty-hint";
            hint.textContent = tier === "미분류" ? "위에서 영화를 검색해 추가하세요" : "여기에 끌어다 놓으세요";
            zone.append(hint);
          }
          inTier.forEach(m => zone.append(cardEl(m)));
          row.append(label, zone);
          board.append(row);
        });
      }

      function cardEl(m) {
        const card = document.createElement("div");
        card.className = "movie-card" + (selectedId === m.id ? " selected" : "");
        card.draggable = true; card.tabIndex = 0;
        card.setAttribute("aria-label", `${m.title}, ${m.tier}`);
        const title = document.createElement("p"); title.className = "movie-title"; title.textContent = m.title;
        card.append(posterEl(m.poster, m.title), title);
        if (selectedId === m.id) {
          const del = document.createElement("button");
          del.type = "button"; del.className = "btn btn-error label-large"; del.textContent = "삭제";
          del.addEventListener("click", e => {
            e.stopPropagation();
            movies = movies.filter(x => x.id !== m.id); selectedId = null;
            save(); render(); if (lastResults.length) renderResults();
          });
          card.append(del);
        }
        card.addEventListener("click", e => { e.stopPropagation(); selectedId = selectedId === m.id ? null : m.id; render(); });
        card.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); card.click(); } });
        card.addEventListener("dragstart", e => { draggedId = m.id; e.dataTransfer.effectAllowed = "move"; e.dataTransfer.setData("text/plain", m.id); card.classList.add("dragging"); });
        card.addEventListener("dragend", () => { draggedId = null; document.querySelectorAll(".drop-zone").forEach(z => z.classList.remove("is-over")); });
        return card;
      }

      document.addEventListener("click", () => { if (selectedId !== null) { selectedId = null; render(); } });
      $("search-input").addEventListener("input", () => { $("search-message").textContent = ""; });

      let snackTimer;
      function snack(text) {
        const el = $("snackbar"); el.textContent = text; el.hidden = false;
        clearTimeout(snackTimer); snackTimer = setTimeout(() => { el.hidden = true; }, 2800);
      }

      // 새로고침해도 같은 창에서는 로그인 유지
      let remembered = null;
      try { remembered = sessionStorage.getItem(SESSION_KEY); } catch {}
      if (remembered && store.get(USERS_KEY, {})[remembered]) enter(remembered);
    })();
  </script>
</body>
</html>
