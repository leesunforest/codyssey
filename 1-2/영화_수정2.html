<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>🎬 Movie Archive</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <style>
    :root {
      --bg: #000000;
      --text: #ffffff;
      --text-dim: #b3b3b3;
      --text-faint: #808080;
      --red: #e50914;
      --red-hover: #f6121d;
      --card-bg: #181818;
      --line: #333333;
      --gutter: 4%;
      --card-w: clamp(132px, 13.4vw, 236px);
      --radius: 4px;
      --ease: cubic-bezier(.2, .8, .2, 1);
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; background: var(--bg); }
    body {
      color: var(--text);
      font-family: Pretendard, "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
      font-size: 14px; line-height: 1.4;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
    }
    button, input { font: inherit; color: inherit; }
    button { cursor: pointer; }
    [hidden] { display: none !important; }
    :focus-visible { outline: 2px solid #fff; outline-offset: 2px; }

    /* ---------- 로그인 ---------- */
    .login { display: grid; place-items: center; min-height: 100vh; padding: 24px; background: radial-gradient(ellipse at top, #1a0204 0%, #000 60%); }
    .login-card { width: min(420px, 100%); padding: 48px 56px; border-radius: var(--radius); background: rgba(0, 0, 0, .75); border: 1px solid #222; }
    .brand { color: #ffffff; font-weight: 900; letter-spacing: -.02em; }
    .login-card .brand { display: block; margin-bottom: 28px; font-size: 28px; }
    .login-card h1 { margin: 0 0 8px; font-size: 30px; font-weight: 700; }
    .login-card p { margin: 0 0 24px; color: var(--text-dim); }
    .login-card form { display: grid; gap: 14px; }
    .input { width: 100%; height: 52px; padding: 0 16px; border: 1px solid #5e5e5e; border-radius: var(--radius); background: rgba(22, 22, 22, .7); outline: none; font-size: 16px; }
    .input:focus { border-color: #fff; }
    .input::placeholder { color: var(--text-faint); }
    .error { min-height: 18px; margin: 0; color: #ff6b6b; font-size: 13px; }
    .btn-red { height: 44px; border: 0; border-radius: var(--radius); background: var(--red); font-size: 16px; font-weight: 700; }
    .btn-red:hover { background: var(--red-hover); }

    /* ---------- 상단 내비게이션 ---------- */
    .nav { position: fixed; inset: 0 0 auto; z-index: 20; display: flex; align-items: center; gap: 24px; height: 68px; padding: 0 var(--gutter); background: linear-gradient(180deg, rgba(0,0,0,.7) 10%, transparent); transition: background .4s; }
    .nav.solid { background: var(--bg); }
    .nav .brand { font-size: 24px; white-space: nowrap; }
    .nav-links { display: flex; gap: 20px; margin: 0; padding: 0; list-style: none; }
    .nav-links a { color: #e5e5e5; font-size: 14px; text-decoration: none; transition: color .3s; }
    .nav-links a:hover { color: var(--text-dim); }
    .nav-links a.active { color: #fff; font-weight: 700; }
    .nav-right { display: flex; align-items: center; gap: 18px; margin-left: auto; }
    .search-box { display: flex; align-items: center; gap: 8px; height: 36px; padding: 0 6px; border: 1px solid transparent; transition: border-color .3s, background .3s; }
    .search-box.open { border-color: #fff; background: rgba(0, 0, 0, .75); }
    .search-box input { width: 0; padding: 0; border: 0; outline: none; background: transparent; font-size: 14px; transition: width .3s var(--ease); }
    .search-box.open input { width: 230px; }
    .search-box input::placeholder { color: var(--text-faint); }
    .icon-btn { display: grid; place-items: center; width: 28px; height: 28px; padding: 0; border: 0; background: none; color: #fff; }
    .icon-btn svg { width: 22px; height: 22px; }
    .profile { display: flex; align-items: center; gap: 8px; }
    .avatar { display: grid; place-items: center; width: 32px; height: 32px; border-radius: var(--radius); background: linear-gradient(135deg, #2b65d9, #1b3f8f); font-size: 14px; font-weight: 800; }
    .profile-name { color: #e5e5e5; font-size: 13px; }
    .link-btn { padding: 0; border: 0; background: none; color: var(--text-dim); font-size: 13px; }
    .link-btn:hover { color: #fff; text-decoration: underline; }

    /* ---------- 배너 ---------- */
    .hero { position: relative; height: 56.25vw; max-height: 86vh; min-height: 480px; overflow: hidden; }
    .hero-bg { position: absolute; inset: 0; background-color: #111; background-position: center 20%; background-size: cover; transform: scale(1.02); }
    .hero-bg.poster-only { background-size: 42% auto; background-position: 88% 30%; background-repeat: no-repeat; filter: saturate(1.05); }
    .hero::before { content: ""; position: absolute; inset: 0; z-index: 1; background: linear-gradient(77deg, rgba(0,0,0,.85) 0%, rgba(0,0,0,.45) 38%, transparent 70%); }
    .hero::after { content: ""; position: absolute; inset: auto 0 0; z-index: 1; height: 38%; background: linear-gradient(180deg, transparent 0%, rgba(0,0,0,.6) 45%, #000 100%); }
    .hero-content { position: absolute; left: var(--gutter); bottom: 32%; z-index: 2; width: min(40%, 620px); }
    .hero-eyebrow { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; color: #e5e5e5; font-size: 15px; font-weight: 700; letter-spacing: .18em; }
    .tier-badge { display: inline-grid; place-items: center; min-width: 30px; height: 30px; padding: 0 6px; border-radius: 3px; background: var(--red); color: #fff; font-size: 16px; font-weight: 900; letter-spacing: 0; }
    .hero-title { margin: 0; font-size: clamp(32px, 4.6vw, 72px); font-weight: 900; line-height: 1.05; letter-spacing: -.03em; text-shadow: 2px 2px 8px rgba(0,0,0,.45); }
    .hero-meta { display: flex; align-items: center; gap: 10px; margin-top: 14px; color: #e5e5e5; font-size: 15px; }
    .age { padding: 0 6px; border: 1px solid #b3b3b3; color: #e5e5e5; font-size: 12px; }
    .hero-overview { margin: 16px 0 0; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; color: #fff; font-size: clamp(14px, 1.2vw, 18px); line-height: 1.5; text-shadow: 1px 1px 4px rgba(0,0,0,.6); }
    .hero-actions { display: flex; gap: 12px; margin-top: 24px; }
    .btn { display: inline-flex; align-items: center; gap: 10px; height: 46px; padding: 0 26px 0 20px; border: 0; border-radius: var(--radius); font-size: 17px; font-weight: 700; white-space: nowrap; transition: background .2s, opacity .2s; }
    .btn svg { width: 26px; height: 26px; }
    .btn-play { background: #fff; color: #000; }
    .btn-play:hover { background: rgba(255,255,255,.75); }
    .btn-info { background: rgba(109,109,110,.7); color: #fff; }
    .btn-info:hover { background: rgba(109,109,110,.4); }
    .hero-tag { position: absolute; right: 0; bottom: 34%; z-index: 2; display: flex; align-items: center; height: 38px; padding: 0 64px 0 12px; border-left: 3px solid #dcdcdc; background: rgba(51,51,51,.6); color: #fff; font-size: 16px; font-weight: 700; }
    .hero-empty { position: relative; z-index: 2; display: flex; flex-direction: column; justify-content: center; height: 100%; padding: 0 var(--gutter); }
    .hero-empty h1 { margin: 0; font-size: clamp(30px, 4vw, 56px); font-weight: 900; letter-spacing: -.03em; }
    .hero-empty p { max-width: 560px; margin: 14px 0 0; color: var(--text-dim); font-size: 18px; }

    /* ---------- 포스터 줄 ---------- */
    .rows { position: relative; z-index: 3; margin-top: -9vw; padding-bottom: 80px; }
    .row { position: relative; margin-bottom: 2.6vw; }
    .row-head { display: flex; align-items: baseline; gap: 10px; margin: 0 var(--gutter) 2px; }
    .row-title { margin: 0; color: #e5e5e5; font-size: clamp(16px, 1.4vw, 22px); font-weight: 700; }
    .row-sub { color: var(--text-faint); font-size: 13px; }
    .row-msg { color: #ff6b6b; font-size: 13px; }
    .see-all { display: inline-flex; align-items: center; gap: 2px; padding: 0; border: 0; background: none; color: #54b9c5; font-size: 13px; font-weight: 700; opacity: 0; transform: translateX(-8px); transition: opacity .3s, transform .3s; }
    .see-all svg { width: 14px; height: 14px; }
    .row-head:hover .see-all, .row.expanded .see-all, .see-all:focus-visible { opacity: 1; transform: none; }
    .row.expanded .track { flex-wrap: wrap; row-gap: 26px; overflow: visible; }
    .row.expanded .arrow, .row.expanded .pager { display: none; }
    .pager { position: absolute; top: 4px; right: var(--gutter); display: flex; gap: 2px; opacity: 0; transition: opacity .2s; }
    .row:hover .pager { opacity: 1; }
    .pager i { width: 12px; height: 2px; background: #4d4d4d; }
    .pager i.on { background: #aaa; }
    .row-viewport { position: relative; }
    .track { display: flex; gap: 6px; padding: 22px var(--gutter) 30px; overflow-x: auto; overflow-y: hidden; scroll-behavior: smooth; scroll-padding: 0 var(--gutter); scrollbar-width: none; }
    .track::-webkit-scrollbar { display: none; }
    .row.is-over .track { background: linear-gradient(90deg, transparent, rgba(229,9,20,.12) 20%, rgba(229,9,20,.12) 80%, transparent); }
    .arrow { position: absolute; top: 22px; bottom: 30px; z-index: 6; display: grid; place-items: center; width: var(--gutter); min-width: 36px; padding: 0; border: 0; background: rgba(20,20,20,.5); color: #fff; opacity: 0; transition: opacity .2s, background .2s; }
    .arrow svg { width: 34px; height: 34px; transition: transform .2s; }
    .arrow.left { left: 0; border-radius: 0 var(--radius) var(--radius) 0; }
    .arrow.right { right: 0; border-radius: var(--radius) 0 0 var(--radius); }
    .row:hover .arrow:not(:disabled) { opacity: 1; }
    .arrow:hover { background: rgba(20,20,20,.75); }
    .arrow:hover svg { transform: scale(1.25); }
    .arrow:disabled { pointer-events: none; }

    .card { position: relative; flex: 0 0 var(--card-w); aspect-ratio: 2 / 3; padding: 0; border: 0; border-radius: var(--radius); background: var(--card-bg); transition: transform .3s var(--ease), box-shadow .3s var(--ease); transform-origin: center; cursor: pointer; user-select: none; }
    .card:first-child { transform-origin: left center; }
    .card:last-child { transform-origin: right center; }
    .card img { display: block; width: 100%; height: 100%; border-radius: inherit; object-fit: cover; pointer-events: none; }
    .card .fallback { display: grid; place-items: center; height: 100%; padding: 12px; color: #e5e5e5; font-size: 15px; font-weight: 700; text-align: center; }
    .card .shade { position: absolute; inset: 0; display: flex; flex-direction: column; justify-content: flex-end; gap: 4px; padding: 12px 10px; border-radius: inherit; background: linear-gradient(180deg, transparent 45%, rgba(0,0,0,.92)); opacity: 0; transition: opacity .3s; text-align: left; }
    .card .shade strong { font-size: 14px; line-height: 1.3; }
    .card .shade span { color: var(--text-dim); font-size: 12px; }
    .card .actions { display: flex; align-items: center; gap: 6px; margin-bottom: 4px; }
    .card .circle { display: grid; place-items: center; width: 28px; height: 28px; border: 1.5px solid rgba(255,255,255,.6); border-radius: 50%; background: rgba(42,42,42,.7); color: #fff; }
    .card .circle.play { border-color: #fff; background: #fff; color: #000; }
    .card .circle svg { width: 14px; height: 14px; }
    .card .shade .tier-tag { margin-left: auto; padding: 1px 6px; border: 1px solid rgba(255,255,255,.4); color: #fff; font-size: 11px; font-weight: 800; }
    .card:hover, .card:focus-visible { z-index: 5; transform: scale(1.12) translateY(-4%); box-shadow: 0 14px 30px rgba(0,0,0,.75); transition-delay: .25s; }
    .card:hover .shade, .card:focus-visible .shade { transition-delay: .25s; }
    .card:hover .shade, .card:focus-visible .shade { opacity: 1; }
    .card.dragging { opacity: .35; }
    .card .rank { position: absolute; top: 0; right: 8px; padding: 4px 5px 6px; border-radius: 0 0 3px 3px; background: var(--red); font-size: 11px; font-weight: 900; line-height: 1; }
    .placeholder { flex: 0 0 var(--card-w); aspect-ratio: 2 / 3; display: grid; place-items: center; padding: 12px; border: 1px dashed #444; border-radius: var(--radius); color: var(--text-faint); font-size: 13px; text-align: center; }

    /* ---------- 예고편 팝업 ---------- */
    dialog.modal { width: min(850px, calc(100% - 32px)); max-height: calc(100vh - 64px); padding: 0; border: 0; border-radius: 8px; overflow: auto; background: var(--card-bg); color: #fff; box-shadow: 0 10px 50px rgba(0,0,0,.8); }
    dialog.modal::backdrop { background: rgba(0,0,0,.72); }
    dialog.modal[open] { animation: pop .28s var(--ease); }
    @keyframes pop { from { opacity: 0; transform: scale(.9); } to { opacity: 1; transform: none; } }
    .modal-media { position: relative; aspect-ratio: 16 / 9; background: #000 center / cover no-repeat; }
    .modal-media iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
    .modal-media::after { content: ""; position: absolute; inset: auto 0 0; height: 30%; background: linear-gradient(180deg, transparent, #181818); pointer-events: none; }
    .modal-media.playing::after { display: none; }
    .modal-media .no-trailer { position: absolute; inset: 0; display: grid; place-items: center; background: linear-gradient(180deg, rgba(0,0,0,.2), rgba(24,24,24,1)); color: var(--text-dim); font-size: 15px; }
    .modal-close { position: absolute; top: 14px; right: 14px; z-index: 2; display: grid; place-items: center; width: 36px; height: 36px; padding: 0; border: 0; border-radius: 50%; background: #181818; color: #fff; }
    .modal-close svg { width: 20px; height: 20px; }
    .modal-body { display: grid; grid-template-columns: minmax(0, 2fr) minmax(0, 1fr); gap: 28px; padding: 24px 40px 36px; }
    .modal-title { margin: 0; font-size: 28px; font-weight: 800; letter-spacing: -.02em; }
    .modal-meta { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; margin-top: 10px; color: var(--text-dim); font-size: 15px; }
    .modal-meta .match { color: #46d369; font-weight: 700; }
    .modal-overview { margin: 16px 0 0; font-size: 15px; line-height: 1.6; }
    .modal-side { color: var(--text-faint); font-size: 14px; line-height: 1.7; }
    .modal-side b { color: #ddd; font-weight: 400; }
    .modal-actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 20px; }
    .chip { height: 36px; padding: 0 14px; border: 1px solid rgba(255,255,255,.5); border-radius: var(--radius); background: rgba(42,42,42,.6); font-size: 14px; font-weight: 700; }
    .chip:hover { border-color: #fff; background: rgba(255,255,255,.1); }
    .chip.on { border-color: #fff; background: #fff; color: #000; }
    .chip.add { border-color: var(--red); background: var(--red); }
    .chip.danger:hover { border-color: #ff6b6b; color: #ff6b6b; }
    .modal-hint { margin: 10px 0 0; color: var(--text-faint); font-size: 12px; }

    .toast { position: fixed; left: 50%; bottom: 28px; z-index: 50; transform: translateX(-50%); padding: 12px 18px; border-radius: var(--radius); background: #fff; color: #000; font-size: 14px; font-weight: 600; box-shadow: 0 6px 20px rgba(0,0,0,.6); }

    @media (max-width: 800px) {
      .nav-links, .profile-name { display: none; }
      .hero-content { width: 80%; bottom: 26%; }
      .search-box.open input { width: 150px; }
      .modal-body { grid-template-columns: 1fr; padding: 20px 20px 28px; }
      .login-card { padding: 36px 28px; }
    }
  </style>
</head>
<body>
  <!-- 로그인 -->
  <section class="login" id="login-view">
    <div class="login-card">
      <span class="brand">🎬 Movie Archive</span>
      <h1>로그인</h1>
      <p>닉네임과 숫자 4자리 비밀번호를 입력하세요. 처음 쓰는 닉네임이면 새로 만들어집니다.</p>
      <form id="login-form" novalidate>
        <input class="input" id="nickname" type="text" maxlength="20" autocomplete="off" placeholder="닉네임" aria-label="닉네임">
        <input class="input" id="pin" type="password" inputmode="numeric" maxlength="4" autocomplete="off" placeholder="비밀번호 (숫자 4자리)" aria-label="비밀번호 숫자 4자리">
        <p class="error" id="login-message" role="alert"></p>
        <button class="btn-red" type="submit">시작하기</button>
      </form>
    </div>
  </section>

  <!-- 메인 -->
  <div id="app-view" hidden>
    <nav class="nav" id="nav">
      <span class="brand">🎬 Movie Archive</span>
      <ul class="nav-links">
        <li><a href="#top" class="active">홈</a></li>
        <li><a href="#row-S">S 등급</a></li>
        <li><a href="#row-미분류">미분류</a></li>
      </ul>
      <div class="nav-right">
        <form class="search-box" id="search-form" novalidate>
          <button class="icon-btn" id="search-toggle" type="button" aria-label="검색">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m15.5 15.5 5 5" stroke-linecap="round"/></svg>
          </button>
          <input id="search-input" type="search" maxlength="100" autocomplete="off" placeholder="영화 제목으로 검색" aria-label="영화 제목 검색">
        </form>
        <span class="profile"><span class="avatar" id="avatar"></span><span class="profile-name" id="user-name"></span></span>
        <button class="link-btn" id="logout-button" type="button">로그아웃</button>
      </div>
    </nav>

    <header class="hero" id="top"></header>
    <main class="rows" id="rows"></main>
  </div>

  <!-- 예고편 팝업 -->
  <dialog class="modal" id="modal" aria-labelledby="modal-title">
    <div class="modal-media" id="modal-media">
      <button class="modal-close" id="modal-close" type="button" aria-label="닫기">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg>
      </button>
    </div>
    <div class="modal-body">
      <div>
        <h2 class="modal-title" id="modal-title"></h2>
        <div class="modal-meta" id="modal-meta"></div>
        <p class="modal-overview" id="modal-overview"></p>
        <div class="modal-actions" id="modal-actions"></div>
        <p class="modal-hint" id="modal-hint"></p>
      </div>
      <div class="modal-side" id="modal-side"></div>
    </div>
  </dialog>

  <div class="toast" id="toast" role="status" hidden></div>

  <!-- API 키는 같은 폴더의 config.js에 넣습니다. (GitHub에는 올리지 않음) -->
  <script src="config.js"></script>
  <script>
    (() => {
      const TIERS = ["S", "A", "B", "C", "미분류"];
      const ROW_NAMES = { S: "S 등급 · 인생 영화", A: "A 등급 · 또 보고 싶은 영화", B: "B 등급 · 괜찮았던 영화", C: "C 등급 · 아쉬웠던 영화", "미분류": "아직 정하지 않은 영화" };
      const API = "https://api.themoviedb.org/3";
      const IMG = size => `https://image.tmdb.org/t/p/${size}`;
      const KEY = (window.TIERLIST_CONFIG && window.TIERLIST_CONFIG.serviceKey || "").trim();
      const USERS_KEY = "tierlist.users";
      const DATA_PREFIX = "tierlist.data.";
      const SESSION_KEY = "tierlist.currentUser";

      const $ = id => document.getElementById(id);
      const el = (tag, cls, text) => { const n = document.createElement(tag); if (cls) n.className = cls; if (text != null) n.textContent = text; return n; };
      const store = {
        get(key, fallback) { try { const v = JSON.parse(localStorage.getItem(key)); return v ?? fallback; } catch { return fallback; } },
        set(key, value) { try { localStorage.setItem(key, JSON.stringify(value)); } catch {} }
      };
      const ICON = {
        left: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="m15 5-7 7 7 7"/></svg>',
        right: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="m9 5 7 7-7 7"/></svg>',
        play: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 4.2v15.6c0 .8.9 1.3 1.6.9l12.4-7.8c.6-.4.6-1.4 0-1.8L7.6 3.3C6.9 2.9 6 3.4 6 4.2Z"/></svg>',
        plus: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>',
        down: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>',
        info: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="12" cy="12" r="9.5"/><path d="M12 11v6M12 7.2v.1" stroke-linecap="round"/></svg>'
      };

      let user = null;
      let movies = [];
      let searchResults = null;   // null = 검색 줄 없음
      let searchMessage = "";
      let draggedId = null;
      const expanded = new Set();

      // ---------- 로그인 ----------
      async function hashPin(nickname, pin) {
        const text = `${nickname}:${pin}`;
        if (window.crypto && crypto.subtle) {
          const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(text));
          return [...new Uint8Array(buf)].map(b => b.toString(16).padStart(2, "0")).join("");
        }
        let h = 0; for (const ch of text) h = (h * 31 + ch.codePointAt(0)) >>> 0; return "s" + h.toString(16);
      }
      $("login-form").addEventListener("submit", async e => {
        e.preventDefault();
        const nickname = $("nickname").value.trim().replace(/\s+/g, " ");
        const pin = $("pin").value;
        const msg = $("login-message");
        if (!nickname) { msg.textContent = "닉네임을 입력해 주세요"; return; }
        if (!/^\d{4}$/.test(pin)) { msg.textContent = "비밀번호는 숫자 4자리로 입력해 주세요"; return; }
        const users = store.get(USERS_KEY, {});
        const hash = await hashPin(nickname, pin);
        if (users[nickname] && users[nickname] !== hash) { msg.textContent = "비밀번호가 맞지 않아요"; return; }
        if (!users[nickname]) { users[nickname] = hash; store.set(USERS_KEY, users); }
        msg.textContent = ""; $("pin").value = "";
        try { sessionStorage.setItem(SESSION_KEY, nickname); } catch {}
        enter(nickname);
      });
      $("pin").addEventListener("input", e => { e.target.value = e.target.value.replace(/\D/g, "").slice(0, 4); });

      function enter(nickname) {
        user = nickname;
        movies = store.get(DATA_PREFIX + nickname, []);
        $("user-name").textContent = nickname;
        $("avatar").textContent = [...nickname][0].toUpperCase();
        $("login-view").hidden = true; $("app-view").hidden = false;
        searchResults = null; searchMessage = ""; $("search-input").value = "";
        renderAll();
        backfill();
      }
      $("logout-button").addEventListener("click", () => {
        user = null; movies = [];
        try { sessionStorage.removeItem(SESSION_KEY); } catch {}
        $("app-view").hidden = true; $("login-view").hidden = false; $("nickname").focus();
      });
      const save = () => { if (user) store.set(DATA_PREFIX + user, movies); };

      // ---------- TMDB ----------
      async function tmdb(path, params = {}) {
        if (!KEY) throw Object.assign(new Error("no key"), { code: "nokey" });
        const isToken = KEY.startsWith("eyJ");
        const q = new URLSearchParams(params);
        if (!isToken) q.set("api_key", KEY);
        const res = await fetch(`${API}${path}?${q}`, isToken ? { headers: { Authorization: `Bearer ${KEY}`, accept: "application/json" } } : {});
        if (res.status === 401) throw Object.assign(new Error("401"), { code: "badkey" });
        if (!res.ok) throw new Error("HTTP " + res.status);
        return res.json();
      }
      const tmdbId = m => Number(String(m.id).replace("tmdb-", ""));
      const fromTmdb = item => ({
        id: "tmdb-" + item.id,
        title: String(item.title || item.original_title || "").replace(/\s+/g, " ").trim(),
        originalTitle: item.original_title || "",
        year: (item.release_date || "").slice(0, 4),
        poster: item.poster_path ? IMG("w342") + item.poster_path : "",
        backdrop: item.backdrop_path ? IMG("w1280") + item.backdrop_path : "",
        overview: item.overview || "",
        rating: item.vote_average || 0
      });

      // 예전에 저장한 영화에 배경 이미지·줄거리가 없으면 한 번 채워 둡니다.
      async function backfill() {
        const need = movies.filter(m => String(m.id).startsWith("tmdb-") && m.backdrop === undefined);
        for (const m of need) {
          try {
            const d = await tmdb(`/movie/${tmdbId(m)}`, { language: "ko-KR" });
            Object.assign(m, { backdrop: d.backdrop_path ? IMG("w1280") + d.backdrop_path : "", overview: m.overview || d.overview || "", rating: d.vote_average || 0, originalTitle: d.original_title || "" });
          } catch { m.backdrop = m.backdrop || ""; }
        }
        if (need.length) { save(); renderAll(); }
      }

      // ---------- 검색 ----------
      const normalize = t => String(t || "").replace(/\s+/g, "").toLowerCase();
      const searchBox = $("search-form");
      $("search-toggle").addEventListener("click", () => {
        if (searchBox.classList.contains("open") && $("search-input").value.trim()) { searchBox.requestSubmit(); return; }
        searchBox.classList.toggle("open");
        if (searchBox.classList.contains("open")) $("search-input").focus();
      });
      $("search-input").addEventListener("blur", () => { if (!$("search-input").value.trim()) searchBox.classList.remove("open"); });
      $("search-input").addEventListener("keydown", e => { if (e.key === "Escape") { $("search-input").value = ""; searchResults = null; searchMessage = ""; renderRows(); $("search-input").blur(); } });
      searchBox.addEventListener("submit", async e => {
        e.preventDefault();
        const query = $("search-input").value.trim();
        if (!query) { searchResults = []; searchMessage = "제목을 입력해 주세요"; renderRows(); return; }
        searchResults = []; searchMessage = "검색 중…"; renderRows();
        try {
          const data = await tmdb("/search/movie", { query, language: "ko-KR", include_adult: "false", page: "1" });
          searchResults = (data.results || []).map(fromTmdb).filter(m => m.title);
          searchMessage = searchResults.length ? "" : "검색 결과가 없어요";
        } catch (err) {
          searchResults = [];
          searchMessage = err.code === "nokey" ? "config.js에 TMDB 키를 넣어 주세요" : err.code === "badkey" ? "API 키가 맞지 않아요. config.js의 키를 확인해 주세요." : "검색하지 못했어요. 인터넷 연결을 확인해 주세요.";
        }
        renderRows();
        window.scrollTo({ top: 0, behavior: "smooth" });
      });

      function addMovie(m) {
        if (movies.some(x => x.id === m.id || (normalize(x.title) === normalize(m.title) && x.year === m.year))) { toast("이미 있는 영화예요"); return false; }
        movies.push({ ...m, tier: "미분류", addedAt: Date.now() });
        save(); renderAll();
        toast(`'${m.title}'을(를) 미분류 줄에 넣었어요`);
        return true;
      }

      // ---------- 화면 그리기 ----------
      function renderAll() { renderHero(); renderRows(); }

      function featured() {
        for (const t of TIERS) { const list = movies.filter(m => m.tier === t); if (list.length) return list[0]; }
        return null;
      }

      function renderHero() {
        const hero = $("top");
        hero.innerHTML = "";
        const m = featured();
        const bg = el("div", "hero-bg");
        hero.append(bg);
        if (!m) {
          const box = el("div", "hero-empty");
          box.append(el("h1", null, "나만의 영화 등급표"), el("p", null, "오른쪽 위 돋보기를 눌러 영화를 검색하고 추가하세요. 포스터를 다른 줄로 끌어다 놓으면 등급이 바뀝니다."));
          hero.append(box);
          return;
        }
        if (m.backdrop) bg.style.backgroundImage = `url("${m.backdrop}")`;
        else if (m.poster) { bg.style.backgroundImage = `url("${m.poster.replace("/w342/", "/w780/")}")`; bg.classList.add("poster-only"); }
        const c = el("div", "hero-content");
        const eyebrow = el("div", "hero-eyebrow");
        eyebrow.append(el("span", "tier-badge", m.tier === "미분류" ? "?" : m.tier), el("span", null, m.tier === "미분류" ? "미분류 영화" : `${m.tier} 등급 대표 영화`));
        const meta = el("div", "hero-meta");
        if (m.year) meta.append(el("span", null, m.year));
        if (m.rating) meta.append(el("span", "age", `★ ${m.rating.toFixed(1)}`));
        const actions = el("div", "hero-actions");
        const play = el("button", "btn btn-play"); play.type = "button"; play.innerHTML = ICON.play + "<span>예고편 재생</span>";
        play.addEventListener("click", () => openModal(m, false));
        actions.append(play);
        c.append(eyebrow, el("h1", "hero-title", m.title), meta);
        if (m.overview) c.append(el("p", "hero-overview", m.overview));
        c.append(actions);
        hero.append(c, el("div", "hero-tag", m.tier === "미분류" ? "미분류" : `${m.tier} 등급`));
      }

      function renderRows() {
        const wrap = $("rows");
        const keep = {};
        wrap.querySelectorAll(".row").forEach(r => { keep[r.dataset.key] = r.querySelector(".track").scrollLeft; });
        wrap.innerHTML = "";
        if (searchResults) wrap.append(buildRow("search", `'${$("search-input").value.trim()}' 검색 결과`, searchResults, { search: true }));
        TIERS.forEach(t => wrap.append(buildRow(t, ROW_NAMES[t], movies.filter(m => m.tier === t), { tier: t })));
        wrap.querySelectorAll(".row").forEach(r => { const tr = r.querySelector(".track"); if (keep[r.dataset.key]) { tr.style.scrollBehavior = "auto"; tr.scrollLeft = keep[r.dataset.key]; tr.style.scrollBehavior = ""; } updateArrows(r); });
      }

      function buildRow(key, title, list, opt) {
        const row = el("section", "row"); row.dataset.key = key; row.id = "row-" + key;
        const head = el("div", "row-head");
        head.append(el("h2", "row-title", title));
        if (opt.search && searchMessage) head.append(el("span", "row-msg", searchMessage));
        else head.append(el("span", "row-sub", `${list.length}편`));
        if (list.length) {
          const all = el("button", "see-all"); all.type = "button";
          all.innerHTML = `<span>${expanded.has(key) ? "접기" : "모두 보기"}</span>` + ICON.right;
          all.addEventListener("click", () => { expanded.has(key) ? expanded.delete(key) : expanded.add(key); renderRows(); });
          head.append(all);
        }
        if (expanded.has(key)) row.classList.add("expanded");
        const pager = el("div", "pager"); row.append(pager);
        const vp = el("div", "row-viewport");
        const track = el("div", "track");
        const left = el("button", "arrow left"); left.type = "button"; left.innerHTML = ICON.left; left.setAttribute("aria-label", "왼쪽으로");
        const right = el("button", "arrow right"); right.type = "button"; right.innerHTML = ICON.right; right.setAttribute("aria-label", "오른쪽으로");
        const page = dir => track.scrollBy({ left: dir * Math.max(track.clientWidth * .86, 200), behavior: "smooth" });
        left.addEventListener("click", () => page(-1));
        right.addEventListener("click", () => page(1));
        track.addEventListener("scroll", () => updateArrows(row), { passive: true });

        list.forEach(m => track.append(cardFor(m, opt)));
        if (!list.length && !opt.search) track.append(el("div", "placeholder", opt.tier === "미분류" ? "돋보기로 영화를 검색해 추가하세요" : "여기에 포스터를 끌어다 놓으세요"));

        if (opt.tier) {
          row.addEventListener("dragover", e => { e.preventDefault(); row.classList.add("is-over"); });
          row.addEventListener("dragleave", e => { if (!row.contains(e.relatedTarget)) row.classList.remove("is-over"); });
          row.addEventListener("drop", e => {
            e.preventDefault(); row.classList.remove("is-over");
            const id = draggedId || e.dataTransfer.getData("text/plain");
            const m = movies.find(x => x.id === id);
            if (m && m.tier !== opt.tier) { m.tier = opt.tier; save(); renderAll(); toast(`'${m.title}' → ${opt.tier === "미분류" ? "미분류" : opt.tier + " 등급"}`); }
          });
        }
        vp.append(left, track, right);
        row.append(head, vp);
        return row;
      }

      function updateArrows(row) {
        const t = row.querySelector(".track");
        const max = t.scrollWidth - t.clientWidth;
        row.querySelector(".arrow.left").disabled = t.scrollLeft <= 2;
        row.querySelector(".arrow.right").disabled = t.scrollLeft >= max - 2;
        const pager = row.querySelector(".pager");
        const pages = max > 2 ? Math.ceil(t.scrollWidth / t.clientWidth) : 0;
        const cur = pages ? Math.min(pages - 1, Math.round(t.scrollLeft / Math.max(1, max) * (pages - 1))) : 0;
        if (pager.childElementCount !== pages) { pager.innerHTML = ""; for (let i = 0; i < pages; i++) pager.append(el("i")); }
        [...pager.children].forEach((n, i) => n.classList.toggle("on", i === cur));
      }

      function cardFor(m, opt) {
        const card = el("button", "card"); card.type = "button";
        card.setAttribute("aria-label", `${m.title}${m.year ? ", " + m.year : ""} 예고편 보기`);
        if (m.poster) {
          const img = el("img"); img.src = m.poster; img.alt = ""; img.loading = "lazy"; img.referrerPolicy = "no-referrer";
          img.addEventListener("error", () => img.replaceWith(el("div", "fallback", m.title)));
          card.append(img);
        } else card.append(el("div", "fallback", m.title));
        const shade = el("div", "shade");
        const acts = el("div", "actions");
        const pc = el("span", "circle play"); pc.innerHTML = ICON.play; acts.append(pc);
        const sc = el("span", "circle"); sc.innerHTML = opt.search && !movies.some(x => x.id === m.id) ? ICON.plus : ICON.down; acts.append(sc);
        const saved = movies.find(x => x.id === m.id);
        if (saved) acts.append(el("span", "tier-tag", saved.tier));
        shade.append(acts);
        shade.append(el("strong", null, m.title), el("span", null, [m.year, opt.search ? (movies.some(x => x.id === m.id) ? "추가됨" : "클릭해서 추가") : null].filter(Boolean).join(" · ")));
        card.append(shade);
        if (opt.tier === "S") { const idx = movies.filter(x => x.tier === "S").indexOf(m); if (idx > -1 && idx < 10) card.append(el("span", "rank", "TOP " + (idx + 1))); }
        card.addEventListener("click", () => openModal(m, !!opt.search));
        if (!opt.search) {
          card.draggable = true;
          card.addEventListener("dragstart", e => { draggedId = m.id; e.dataTransfer.effectAllowed = "move"; e.dataTransfer.setData("text/plain", m.id); card.classList.add("dragging"); });
          card.addEventListener("dragend", () => { draggedId = null; card.classList.remove("dragging"); document.querySelectorAll(".row.is-over").forEach(r => r.classList.remove("is-over")); });
        }
        return card;
      }

      // ---------- 예고편 팝업 ----------
      const modal = $("modal");
      let modalToken = 0;
      async function openModal(m, fromSearch) {
        const token = ++modalToken;
        const media = $("modal-media");
        media.querySelectorAll("iframe, .no-trailer").forEach(n => n.remove()); media.classList.remove("playing");
        media.style.backgroundImage = m.backdrop ? `url("${m.backdrop}")` : (m.poster ? `url("${m.poster.replace("/w342/", "/w780/")}")` : "none");
        $("modal-title").textContent = m.title;
        const meta = $("modal-meta"); meta.innerHTML = "";
        if (m.rating) meta.append(el("span", "match", `평점 ${m.rating.toFixed(1)}`));
        if (m.year) meta.append(el("span", null, m.year));
        const saved = movies.find(x => x.id === m.id);
        if (saved) meta.append(el("span", "tier-badge", saved.tier === "미분류" ? "?" : saved.tier));
        $("modal-overview").textContent = m.overview || "줄거리 정보가 없어요.";
        $("modal-side").innerHTML = "";
        if (m.originalTitle && m.originalTitle !== m.title) { const p = el("div"); p.append("원제: ", el("b", null, m.originalTitle)); $("modal-side").append(p); }
        if (saved && saved.addedAt) { const p = el("div"); p.append("추가한 날: ", el("b", null, new Date(saved.addedAt).toLocaleDateString("ko-KR"))); $("modal-side").append(p); }
        renderModalActions(m);
        if (!modal.open) modal.showModal();

        const id = tmdbId(m);
        if (!id) { media.append(el("div", "no-trailer", "예고편이 없어요")); return; }
        let key = null;
        try {
          for (const language of ["ko-KR", "en-US"]) {
            const v = await tmdb(`/movie/${id}/videos`, { language });
            const yt = (v.results || []).filter(x => x.site === "YouTube");
            const pick = yt.find(x => x.type === "Trailer" && x.official) || yt.find(x => x.type === "Trailer") || yt.find(x => x.type === "Teaser") || yt[0];
            if (pick) { key = pick.key; break; }
          }
        } catch {}
        if (token !== modalToken || !modal.open) return;
        if (key) {
          const f = el("iframe");
          f.src = `https://www.youtube.com/embed/${key}?rel=0&modestbranding=1`;
          f.allow = "encrypted-media; picture-in-picture; fullscreen";
          f.allowFullscreen = true; f.title = `${m.title} 예고편`;
          media.append(f); media.classList.add("playing");
        } else media.append(el("div", "no-trailer", "예고편이 없어요"));
      }

      function renderModalActions(m) {
        const box = $("modal-actions"); box.innerHTML = "";
        const saved = movies.find(x => x.id === m.id);
        if (!saved) {
          const add = el("button", "chip add", "+ 내 등급표에 추가"); add.type = "button";
          add.addEventListener("click", () => { if (addMovie(m)) { renderModalActions(m); } });
          box.append(add);
          $("modal-hint").textContent = "추가하면 '아직 정하지 않은 영화' 줄에 들어갑니다.";
          return;
        }
        TIERS.forEach(t => {
          const b = el("button", "chip" + (saved.tier === t ? " on" : ""), t); b.type = "button";
          b.addEventListener("click", () => { saved.tier = t; save(); renderAll(); renderModalActions(m); });
          box.append(b);
        });
        const del = el("button", "chip danger", "삭제"); del.type = "button";
        del.addEventListener("click", () => { movies = movies.filter(x => x.id !== m.id); save(); renderAll(); closeModal(); toast(`'${m.title}'을(를) 삭제했어요`); });
        box.append(del);
        $("modal-hint").textContent = "등급 버튼을 누르거나, 홈 화면에서 포스터를 다른 줄로 끌어다 놓아도 옮겨집니다.";
      }

      function closeModal() { modalToken++; $("modal-media").querySelectorAll("iframe").forEach(f => f.remove()); if (modal.open) modal.close(); }
      $("modal-close").addEventListener("click", closeModal);
      modal.addEventListener("click", e => { if (e.target === modal) closeModal(); });
      modal.addEventListener("close", () => { modalToken++; $("modal-media").querySelectorAll("iframe").forEach(f => f.remove()); });

      // ---------- 기타 ----------
      const nav = $("nav");
      window.addEventListener("scroll", () => nav.classList.toggle("solid", window.scrollY > 10), { passive: true });
      window.addEventListener("resize", () => document.querySelectorAll(".row").forEach(updateArrows));

      let toastTimer;
      function toast(text) { const t = $("toast"); t.textContent = text; t.hidden = false; clearTimeout(toastTimer); toastTimer = setTimeout(() => { t.hidden = true; }, 2600); }

      let remembered = null;
      try { remembered = sessionStorage.getItem(SESSION_KEY); } catch {}
      if (remembered && store.get(USERS_KEY, {})[remembered]) enter(remembered);
    })();
  </script>
</body>
</html>
