<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>내 영화 티어리스트</title>
  <style>
    :root {
      --ink: #f5f1e8;
      --muted: #a9a8af;
      --panel: rgba(28, 28, 36, .88);
      --line: rgba(255, 255, 255, .11);
      --accent: #ffcc6e;
      --shadow: 0 20px 55px rgba(0, 0, 0, .28);
    }
    * { box-sizing: border-box; }
    body {
      min-width: 320px;
      margin: 0;
      color: var(--ink);
      font-family: Pretendard, "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
      background:
        radial-gradient(circle at 9% 3%, rgba(217, 79, 79, .24), transparent 28rem),
        radial-gradient(circle at 95% 15%, rgba(69, 112, 166, .21), transparent 30rem),
        #111116;
    }
    .page { width: min(1120px, calc(100% - 40px)); margin: 0 auto; padding: 48px 0 68px; }
    header { display: flex; justify-content: space-between; align-items: end; gap: 24px; margin-bottom: 28px; }
    .eyebrow { margin: 0 0 9px; color: var(--accent); font-size: 12px; font-weight: 800; letter-spacing: .16em; }
    h1 { margin: 0; font-family: Georgia, "Times New Roman", serif; font-size: clamp(34px, 5vw, 56px); font-weight: 500; letter-spacing: -.05em; line-height: 1; }
    .subtitle { max-width: 300px; margin: 0; color: var(--muted); font-size: 14px; line-height: 1.65; text-align: right; }
    .board { overflow: hidden; border: 1px solid var(--line); border-radius: 18px; box-shadow: var(--shadow); background: var(--panel); backdrop-filter: blur(10px); }
    .tier-row { display: grid; grid-template-columns: 104px minmax(0, 1fr); min-height: 98px; border-bottom: 1px solid var(--line); }
    .tier-row:last-child { border-bottom: 0; }
    .tier-label { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; color: #16151a; font-family: Georgia, "Times New Roman", serif; font-size: 40px; font-weight: 700; line-height: 1; }
    .tier-label small { font-family: inherit; font-size: 10px; letter-spacing: .08em; opacity: .6; }
    [data-tier="S"] .tier-label { background: #e95a5f; }
    [data-tier="A"] .tier-label { background: #ef9c54; }
    [data-tier="B"] .tier-label { background: #e9c75d; }
    [data-tier="C"] .tier-label { background: #7fbd91; }
    [data-tier="미분류"] .tier-label { background: #9a9ba4; font-family: Pretendard, "Apple SD Gothic Neo", sans-serif; font-size: 15px; letter-spacing: -.04em; }
    .drop-zone { display: flex; flex-wrap: wrap; align-content: center; gap: 10px; min-width: 0; padding: 16px 20px; transition: background .16s ease, box-shadow .16s ease; }
    .drop-zone.is-over { background: rgba(255, 204, 110, .1); box-shadow: inset 0 0 0 2px rgba(255, 204, 110, .7); }
    .empty-hint { align-self: center; color: #73737b; font-size: 13px; user-select: none; }
    .movie-card { display: inline-flex; align-items: center; max-width: 100%; min-height: 42px; padding: 8px 10px 8px 14px; border: 1px solid rgba(255, 255, 255, .15); border-radius: 8px; background: linear-gradient(145deg, #34343e, #25252c); box-shadow: 0 6px 14px rgba(0, 0, 0, .16); color: #f6f2ea; cursor: grab; font-size: 14px; line-height: 1.35; user-select: none; }
    .movie-card:active { cursor: grabbing; }
    .movie-card.dragging { opacity: .35; }
    .movie-card.selected { border-color: var(--accent); box-shadow: 0 0 0 2px rgba(255, 204, 110, .18), 0 8px 16px rgba(0, 0, 0, .25); }
    .movie-title { overflow-wrap: anywhere; }
    .delete-button { margin-left: 10px; padding: 5px 8px; border: 1px solid rgba(255,255,255,.17); border-radius: 5px; background: #c94f55; color: white; font: inherit; font-size: 12px; cursor: pointer; }
    .delete-button:hover { background: #df5a60; }
    .add-panel { display: grid; grid-template-columns: 1fr auto; gap: 10px; margin-top: 20px; padding: 17px; border: 1px solid var(--line); border-radius: 14px; background: rgba(31, 31, 39, .78); }
    .add-panel input { min-width: 0; height: 46px; padding: 0 14px; border: 1px solid rgba(255,255,255,.15); border-radius: 8px; outline: none; background: #18181e; color: var(--ink); font: inherit; font-size: 15px; }
    .add-panel input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(255, 204, 110, .12); }
    .add-panel input::placeholder { color: #83838b; }
    .add-panel button { height: 46px; padding: 0 21px; border: 0; border-radius: 8px; background: var(--accent); color: #242021; font: inherit; font-size: 14px; font-weight: 800; cursor: pointer; }
    .add-panel button:hover { filter: brightness(1.07); }
    .message { min-height: 20px; margin: 9px 3px 0; color: #ff9d9f; font-size: 13px; }
    .guide { display: flex; gap: 9px; align-items: center; margin: 18px 2px 0; color: var(--muted); font-size: 13px; line-height: 1.6; }
    .guide-mark { display: grid; place-items: center; flex: 0 0 21px; width: 21px; height: 21px; border: 1px solid rgba(255,255,255,.25); border-radius: 50%; color: var(--accent); font-size: 12px; }
    @media (max-width: 620px) {
      .page { width: min(100% - 24px, 1120px); padding-top: 26px; }
      header { align-items: start; flex-direction: column; gap: 13px; }
      .subtitle { text-align: left; }
      .tier-row { grid-template-columns: 70px minmax(0, 1fr); min-height: 90px; }
      .tier-label { font-size: 30px; }
      [data-tier="미분류"] .tier-label { font-size: 12px; }
      .drop-zone { padding: 13px; gap: 8px; }
      .add-panel { grid-template-columns: 1fr; }
      .add-panel button { width: 100%; }
    }
  </style>
</head>
<body>
  <main class="page">
    <header>
      <div>
        <p class="eyebrow">PERSONAL CINEMA ARCHIVE</p>
        <h1>내 영화 티어리스트</h1>
      </div>
      <p class="subtitle">좋아하는 영화를 끌어서, 지금의 취향대로 한 칸에만 남겨 두세요.</p>
    </header>

    <section class="board" id="board" aria-label="영화 티어리스트"></section>

    <form class="add-panel" id="add-form" novalidate>
      <input id="title-input" type="text" maxlength="100" autocomplete="off" placeholder="새 영화 제목을 입력하세요" aria-label="새 영화 제목">
      <button type="submit">영화 추가</button>
    </form>
    <p class="message" id="message" role="alert" aria-live="polite"></p>
    <p class="guide"><span class="guide-mark">i</span>카드를 끌어 등급 칸에 놓으면 이동합니다. 카드를 클릭하면 삭제할 수 있습니다.</p>
  </main>

  <script>
    (() => {
      "use strict";
      const STORAGE_KEY = "movie-tierlist-b-v1";
      const TIERS = ["S", "A", "B", "C", "미분류"];
      const LABELS = { S: "최고", A: "아주 좋아", B: "좋아", C: "보통", "미분류": "미분류" };
      const INITIAL_TITLES = ["기생충", "인터스텔라", "라라랜드", "센과 치히로의 행방불명", "어벤져스: 엔드게임", "범죄도시", "타이타닉", "토이 스토리"];
      let selectedId = null;
      let draggedId = null;
      let movies = loadMovies();

      function defaultMovies() {
        return INITIAL_TITLES.map((title, index) => ({ id: "starter-" + index, title, tier: "미분류" }));
      }
      function loadMovies() {
        try {
          const stored = JSON.parse(localStorage.getItem(STORAGE_KEY));
          if (Array.isArray(stored) && stored.every(movie => movie && typeof movie.id === "string" && typeof movie.title === "string" && TIERS.includes(movie.tier))) return stored;
        } catch (error) { /* 저장된 데이터가 손상되면 처음 목록을 사용합니다. */ }
        return defaultMovies();
      }
      function saveMovies() {
        try { localStorage.setItem(STORAGE_KEY, JSON.stringify(movies)); } catch (error) { /* 파일 단독 실행 환경에서도 화면 동작은 유지합니다. */ }
      }
      function createRow(tier) {
        const row = document.createElement("div");
        row.className = "tier-row";
        row.dataset.tier = tier;
        const label = document.createElement("div");
        label.className = "tier-label";
        label.textContent = tier;
        const description = document.createElement("small");
        description.textContent = LABELS[tier];
        label.append(description);
        const zone = document.createElement("div");
        zone.className = "drop-zone";
        zone.dataset.tier = tier;
        zone.setAttribute("aria-label", tier + " 등급 영화");
        zone.addEventListener("dragover", event => { event.preventDefault(); zone.classList.add("is-over"); });
        zone.addEventListener("dragleave", event => { if (!zone.contains(event.relatedTarget)) zone.classList.remove("is-over"); });
        zone.addEventListener("drop", event => {
          event.preventDefault();
          zone.classList.remove("is-over");
          const id = event.dataTransfer.getData("text/plain") || draggedId;
          moveMovie(id, tier);
        });
        row.append(label, zone);
        return row;
      }
      function createCard(movie) {
        const card = document.createElement("div");
        card.className = "movie-card" + (selectedId === movie.id ? " selected" : "");
        card.draggable = true;
        card.tabIndex = 0;
        card.setAttribute("aria-label", movie.title + ", 클릭하면 삭제 버튼이 표시됩니다");
        const title = document.createElement("span");
        title.className = "movie-title";
        title.textContent = movie.title;
        card.append(title);
        if (selectedId === movie.id) {
          const remove = document.createElement("button");
          remove.type = "button";
          remove.className = "delete-button";
          remove.textContent = "삭제";
          remove.setAttribute("aria-label", movie.title + " 삭제");
          remove.addEventListener("click", event => {
            event.stopPropagation();
            movies = movies.filter(item => item.id !== movie.id);
            selectedId = null;
            saveMovies();
            render();
          });
          card.append(remove);
        }
        card.addEventListener("click", event => { event.stopPropagation(); selectedId = selectedId === movie.id ? null : movie.id; render(); });
        card.addEventListener("keydown", event => { if (event.key === "Enter" || event.key === " ") { event.preventDefault(); card.click(); } });
        card.addEventListener("dragstart", event => { draggedId = movie.id; event.dataTransfer.effectAllowed = "move"; event.dataTransfer.setData("text/plain", movie.id); card.classList.add("dragging"); });
        card.addEventListener("dragend", () => { draggedId = null; document.querySelectorAll(".drop-zone").forEach(zone => zone.classList.remove("is-over")); });
        return card;
      }
      function moveMovie(id, destination) {
        const movie = movies.find(item => item.id === id);
        if (!movie || movie.tier === destination) return;
        movie.tier = destination;
        // 이동한 카드는 목적지에서 가장 나중에 보입니다.
        movies = movies.filter(item => item.id !== id);
        movies.push(movie);
        selectedId = null;
        saveMovies();
        render();
      }
      function render() {
        const board = document.getElementById("board");
        board.replaceChildren();
        TIERS.forEach(tier => board.append(createRow(tier)));
        TIERS.forEach(tier => {
          const zone = board.querySelector('.drop-zone[data-tier="' + tier + '"]');
          const inTier = movies.filter(movie => movie.tier === tier);
          if (!inTier.length) {
            const hint = document.createElement("span");
            hint.className = "empty-hint";
            hint.textContent = "여기에 영화를 놓으세요";
            zone.append(hint);
          } else inTier.forEach(movie => zone.append(createCard(movie)));
        });
      }
      document.addEventListener("click", () => { if (selectedId !== null) { selectedId = null; render(); } });
      document.getElementById("add-form").addEventListener("submit", event => {
        event.preventDefault();
        const input = document.getElementById("title-input");
        const message = document.getElementById("message");
        const title = input.value.trim();
        if (!title) { message.textContent = "제목을 입력해 주세요"; input.focus(); return; }
        const comparable = value => value.replace(/\s+/g, "").toLocaleLowerCase("ko-KR");
        if (movies.some(movie => comparable(movie.title) === comparable(title))) { message.textContent = "이미 있는 영화예요"; input.focus(); return; }
        movies.push({ id: "movie-" + Date.now() + "-" + Math.random().toString(16).slice(2), title, tier: "미분류" });
        saveMovies();
        input.value = "";
        message.textContent = "";
        render();
      });
      document.getElementById("title-input").addEventListener("input", () => { document.getElementById("message").textContent = ""; });
      render();
    })();
  </script>
</body>
</html>
